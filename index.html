    <!-- Fonts: preconnect + stylesheet link rather than a CSS @import, which
         would be render-blocking and chain HTML -> CSS -> font CSS -> fonts.
         media="print" + onload flips them to non-blocking, so first paint never
         waits on Fontshare; text renders in the fallback and swaps in. -->
    <link rel="preconnect" href="https://api.fontshare.com" />
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <link
      rel="stylesheet"
      href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@700,800&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap"
      />
      <link
        rel="stylesheet"
